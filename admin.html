<body>

  <!-- =========================
       ADMIN PIN SCREEN
  ========================== -->
  <div
    id="adminPinScreen"
    class="adminPinScreen"
  >
    <div class="adminPinCard">

      <div class="adminPinHeader">

        <div class="adminPinLogo">
          لوحة الأسئلة
        </div>

        <div class="adminPinTitle">
          الحنكة
        </div>

        <div class="adminPinSub">
          أدخل كود الأدمن للمتابعة
        </div>

      </div>

      <div class="adminPinForm">

        <input
          id="adminPinInput"
          class="adminPinInput"
          type="tel"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="40"
          autocomplete="one-time-code"
          placeholder="كود الأدمن"
        >

        <button
          id="adminPinLoginBtn"
          type="button"
          class="adminPinBtn"
          onclick="checkAdminPinFromInput()"
        >
          دخول
        </button>

        <div
          id="adminPinError"
          class="adminPinError"
          role="alert"
          aria-live="polite"
        ></div>

      </div>

    </div>
  </div>


  <!-- =========================
       ADMIN APPLICATION
  ========================== -->
  <div
    id="adminShellNew"
    class="adminShellNew hidden"
  >

    <!-- =========================
         MODEL GATE
    ========================== -->
    <section
      id="adminModelGate"
      class="adminModelGate"
    >

      <div class="adminModelGateCard">

        <div class="adminModelGateHero">

          <span>
            لوحة الأسئلة
          </span>

          <h1>
            الحنكة
          </h1>

          <p>
            اختر نموذجًا للبدء، أو أنشئ نموذجًا جديدًا.
            بعد فتح النموذج ستظهر لك لوحة الفقرات والتحرير.
          </p>

        </div>

        <div class="adminModelGatePanel">

          <div
            id="adminModelGateStart"
            class="adminModelGateActions"
          >

            <button
              type="button"
              class="adminModelPrimaryBtn"
              onclick="showAdminModelLoginMode()"
            >
              الدخول للنموذج
            </button>

            <button
              type="button"
              class="adminModelCreateBtn"
              onclick="showAdminModelCreateMode()"
            >
              إنشاء نموذج
            </button>

            <button
              type="button"
              class="adminModelSoftBtn"
              onclick="openSupabaseCleanupGatePage()"
            >
              تنظيف Supabase
            </button>

          </div>

          <div
            id="adminModelLoginBox"
            class="hidden"
          >

            <div class="adminModelGateField">

              <label for="modelsList">
                النماذج المحفوظة
              </label>

              <select
                id="modelsList"
                class="adminSelect"
              >
                <option value="">
                  اختر النموذج
                </option>
              </select>

            </div>

            <div class="adminModelGateActions">

              <button
                type="button"
                class="adminModelPrimaryBtn"
                onclick="openSelectedModel()"
              >
                فتح النموذج
              </button>

              <button
                type="button"
                class="adminModelDangerBtn"
                onclick="deleteSelectedModel()"
              >
                حذف النموذج
              </button>

              <button
                type="button"
                class="adminModelSoftBtn"
                onclick="showAdminModelGateStart()"
              >
                رجوع
              </button>

            </div>

          </div>

          <div
            id="adminModelCreateBox"
            class="adminModelCreateBox hidden"
          >

            <div class="adminModelGateField">

              <label for="modelName">
                اسم النموذج
              </label>

              <input
                id="modelName"
                class="adminInput"
                type="text"
                maxlength="80"
                autocomplete="off"
                placeholder="اسم النموذج الجديد"
              >

            </div>

            <div class="adminModelGateField">

              <label for="modelAdminPin">
                الرقم السري للنموذج
              </label>

              <input
                id="modelAdminPin"
                class="adminInput"
                type="password"
                maxlength="40"
                autocomplete="new-password"
                placeholder="اكتب رقم سري خاص بالنموذج"
              >

            </div>

            <div class="adminModelGateField">

              <label for="modelAdminPinConfirm">
                تأكيد الرقم السري
              </label>

              <input
                id="modelAdminPinConfirm"
                class="adminInput"
                type="password"
                maxlength="40"
                autocomplete="new-password"
                placeholder="أعد كتابة الرقم السري"
              >

            </div>

            <div class="adminModelGateField">

              <label>
                الفقرات المفعلة في البداية
              </label>

              <div id="newModelSegmentsList"></div>

            </div>

            <div class="adminModelGateActions">

              <button
                type="button"
                class="adminModelCreateBtn"

                إنشاء النموذج

  <!-- =========================
       ADMIN PIN BOOTSTRAP
  ========================== -->
  <script>
    let adminPanelInitPromise = null
    let adminPinBusy = false

    function unlockAdminPanel() {
      document
        .getElementById("adminPinScreen")
        ?.classList.add("hidden")

      document
        .getElementById("adminShellNew")
        ?.classList.remove("hidden")
    }

    function lockAdminPanel() {
      document
        .getElementById("adminShellNew")
        ?.classList.add("hidden")

      document
        .getElementById("adminPinScreen")
        ?.classList.remove("hidden")
    }

    async function initializeAdminPanelOnce() {
      if (adminPanelInitPromise) {
        return adminPanelInitPromise
      }

      if (
        typeof window.initAdminPanel !==
        "function"
      ) {
        console.error(
          "Missing function: initAdminPanel"
        )

        const errorBox =
          document.getElementById(
            "adminPinError"
          )

        if (errorBox) {
          errorBox.innerText =
            "تعذر تحميل ملفات لوحة الأدمن"
        }

        return false
      }

      adminPanelInitPromise =
        Promise.resolve()
          .then(() => {
            return window.initAdminPanel()
          })
          .then(() => true)
          .catch(error => {
            console.error(
              "INIT ADMIN PANEL ERROR:",
              error
            )

            adminPanelInitPromise = null

            const errorBox =
              document.getElementById(
                "adminPinError"
              )

            if (errorBox) {
              errorBox.innerText =
                "حدث خطأ أثناء تشغيل لوحة الأدمن"
            }

            return false
          })

      return adminPanelInitPromise
    }

    function setAdminPinBusy(value) {
      adminPinBusy =
        Boolean(value)

      const button =
        document.getElementById(
          "adminPinLoginBtn"
        )

      const input =
        document.getElementById(
          "adminPinInput"
        )

      if (button) {
        button.disabled =
          adminPinBusy

        button.innerText =
          adminPinBusy
            ? "جارٍ الدخول..."
            : "دخول"
      }

      if (input) {
        input.disabled =
          adminPinBusy
      }
    }

    async function checkAdminPinFromInput() {
      if (adminPinBusy) {
        return false
      }

      const input =
        document.getElementById(
          "adminPinInput"
        )

      const errorBox =
        document.getElementById(
          "adminPinError"
        )

      const pin =
        String(input?.value || "")
          .trim()

      if (errorBox) {
        errorBox.innerText = ""
      }

      try {
        setAdminPinBusy(true)

        if (
          typeof window.claimAdminDeviceAccess !==
          "function"
        ) {
          throw new Error(
            "claimAdminDeviceAccess is not ready"
          )
        }

        const accessGranted =
          await window.claimAdminDeviceAccess(pin)

        if (!accessGranted) {
          if (errorBox) {
            errorBox.innerText =
              "كود الأدمن غير صحيح"
          }

          if (input) {
            input.value = ""
            input.focus()

            input.classList.remove(
              "adminPinShake"
            )

            void input.offsetWidth

            input.classList.add(
              "adminPinShake"
            )
          }

          return false
        }

        localStorage.setItem(
          "admin_device_ok",
          "1"
        )

        unlockAdminPanel()

        const initialized =
          await initializeAdminPanelOnce()

        if (!initialized) {
          localStorage.removeItem(
            "admin_device_ok"
          )

          lockAdminPanel()

          return false
        }

        return true
      } catch (error) {
        console.error(
          "ADMIN PIN LOGIN ERROR:",
          error
        )

        localStorage.removeItem(
          "admin_device_ok"
        )

        lockAdminPanel()

        if (errorBox) {
          errorBox.innerText =
            "تعذر تشغيل لوحة الأدمن"
        }

        return false
      } finally {
        setAdminPinBusy(false)
      }
    }

    function logoutAdminPin() {
      localStorage.removeItem(
        "admin_device_ok"
      )

      location.reload()
    }

    document.addEventListener(
      "DOMContentLoaded",
      async () => {
        const input =
          document.getElementById(
            "adminPinInput"
          )

        const errorBox =
          document.getElementById(
            "adminPinError"
          )

        input?.addEventListener(
          "input",
          () => {
            if (errorBox) {
              errorBox.innerText = ""
            }
          }
        )

        input?.addEventListener(
          "keydown",
          event => {
            if (event.key === "Enter") {
              event.preventDefault()
              checkAdminPinFromInput()
            }
          }
        )

        const isUnlocked =
          localStorage.getItem(
            "admin_device_ok"
          ) === "1"

        if (!isUnlocked) {
          input?.focus()
          return
        }

        setAdminPinBusy(true)

        const accessStillValid =
          typeof window.checkAdminDeviceAccess ===
          "function" &&
          await window.checkAdminDeviceAccess()

        if (!accessStillValid) {
          localStorage.removeItem(
            "admin_device_ok"
          )

          lockAdminPanel()
          input?.focus()
          return
        }

        unlockAdminPanel()

        try {
          const initialized =
            await initializeAdminPanelOnce()

          if (!initialized) {
            localStorage.removeItem(
              "admin_device_ok"
            )

            lockAdminPanel()
            input?.focus()
          }
        } finally {
          setAdminPinBusy(false)
        }
      }
    )

    window.checkAdminPinFromInput =
      checkAdminPinFromInput

    window.logoutAdminPin =
      logoutAdminPin
  </script>
