<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#EEF3F6">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <title>الحنكة</title>

  <!-- =========================
       CSS
  ========================== -->

  <link
    rel="stylesheet"
    href="assets/css/presenter.css?v=3"
  >

  <link
    rel="stylesheet"
    href="assets/css/presenter/presenter-core.css?v=9"
  >

  <link
    rel="stylesheet"
    href="assets/css/presenter/segments/warmup-presenter.css?v=3"
  >

  <link
    rel="stylesheet"
    href="assets/css/presenter/segments/top10-presenter.css?v=3"
  >

  <link
    rel="stylesheet"
    href="assets/css/presenter/segments/who-presenter.css?v=3"
  >

  <link
    rel="stylesheet"
    href="assets/css/presenter/segments/explain-presenter.css?v=8"
  >

  <link
  rel="stylesheet"
  href="assets/css/presenter/segments/family-didi-presenter.css?v=1"
>

  <link
    rel="stylesheet"
    href="assets/css/presenter/segments/final-presenter.css?v=13"
  >

  <link
    rel="stylesheet"
    href="assets/css/presenter/segments/random-challenge-presenter.css?v=11"
  >
</head>

<body>

  <main
    id="presenterApp"
    class="presenterApp presenterLandscapeApp"
  >

    <!-- =========================
         JOIN
    ========================== -->

    <section
      id="presenterJoin"
      class="presenterPage presenterJoinPage"
      aria-labelledby="presenterJoinTitle"
    >
      <div class="presenterJoinShell">

        <header class="presenterJoinHeader">
          <span class="presenterEyebrow">
            الحنكة
          </span>

          <h1 id="presenterJoinTitle">
            الحنكة
          </h1>
        </header>

        <section
          class="presenterJoinCard"
          aria-label="الدخول"
        >

          <div
            class="presenterModeSwitch"
            role="group"
            aria-label="نوع الدخول"
          >
            <button
              type="button"
              id="presenterControlModeBtn"
              class="presenterModeBtn active"
              onclick="setPresenterJoinMode('control')"
            >
              تحكم
            </button>

            <button
              type="button"
              id="presenterReaderModeBtn"
              class="presenterModeBtn"
              onclick="setPresenterJoinMode('reader')"
            >
              دليل الأسئلة
            </button>
          </div>

          <form
            class="presenterJoinForm"
            onsubmit="
              event.preventDefault();
              joinGameSession();
            "
          >
            <label for="joinCodeInput">
              كود الجلسة
            </label>

            <input
              id="joinCodeInput"
              name="joinCode"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              pattern="[0-9]*"
              maxlength="4"
              enterkeyhint="go"
              placeholder="0000"
              aria-describedby="presenterJoinStatus"
              oninput="
                this.value = this.value
                  .replace(/\D/g, '')
                  .slice(0, 4)
              "
            >

            <button
              type="submit"
              id="presenterJoinBtn"
              class="presenterPrimaryBtn"
            >
              دخول
            </button>
          </form>

          <p
            id="presenterJoinStatus"
            class="presenterJoinStatus"
            role="status"
            aria-live="polite"
          >
            وضع التحكم
          </p>

        </section>

      </div>
    </section>


    <!-- =========================
         HOME
    ========================== -->

    <section
      id="presenterHome"
      class="presenterPage presenterHomePage presenterLandscapeView hidden"
      aria-labelledby="presenterTitle"
    >
      <div class="presenterHomeShell presenterLandscapeShell">

        <header class="presenterHomeHeader presenterMainHeader">

          <div class="presenterHomeHeading">
            <span class="presenterEyebrow">
              الحنكة
            </span>

            <h1 id="presenterTitle">
              الحنكة
            </h1>

            <p
              id="presenterSubtitle"
              class="presenterSubtitle"
              aria-live="polite"
            ></p>
          </div>

          <div
            class="presenterHomeScores"
            aria-label="النتيجة"
          >
            <article class="presenterHomeTeam presenterHomeTeamA">
              <span id="presenterHomeTeamA">
                الفريق الأول
              </span>

              <strong id="presenterHomeScoreA">
                0
              </strong>
            </article>

            <article class="presenterHomeTeam presenterHomeTeamB">
              <span id="presenterHomeTeamB">
                الفريق الثاني
              </span>

              <strong id="presenterHomeScoreB">
                0
              </strong>
            </article>
          </div>

        </header>

        <section
          class="presenterSegmentsSection"
          aria-label="الفقرات"
        >
          <div
            id="presenterSegmentsGrid"
            class="presenterSegmentsGrid presenterSegmentsCardsGrid"
            aria-live="polite"
          ></div>
        </section>

      </div>
    </section>


    <!-- =========================
         SEGMENT
    ========================== -->

    <section
      id="presenterSegmentPage"
      class="presenterPage presenterSegmentPage presenterLandscapeView hidden"
      aria-labelledby="presenterSegmentTitle"
    >
      <div class="presenterSegmentShell presenterLandscapeShell">

        <header class="presenterSegmentTopbar presenterSegmentHeader">

          <button
            type="button"
            class="presenterBackBtn presenterHeaderBtn"
            onclick="presenterGoHome()"
            aria-label="الرئيسية"
          >
            الرئيسية
          </button>

          <button
            type="button"
            id="teamA"
            class="presenterHeaderTeamBtn"
            onclick="selectTeam('A')"
          >
            <span id="presenterSegmentTeamAName">
              الفريق الأول
            </span>
          </button>

          <h1 id="presenterSegmentTitle">
            الفقرة
          </h1>

          <button
            type="button"
            id="teamB"
            class="presenterHeaderTeamBtn"
            onclick="selectTeam('B')"
          >
            <span id="presenterSegmentTeamBName">
              الفريق الثاني
            </span>
          </button>

          <button
            type="button"
            id="presenterEndSegmentBtn"
            class="presenterHeaderBtn presenterEndSegmentBtn"
            onclick="presenterEndSegment()"
          >
            إنهاء
          </button>

        </header>

        <div
          id="presenterPanel"
          class="presenterPanel presenterSegmentPanel"
          aria-live="polite"
        ></div>

      </div>
    </section>
    <!-- =========================
         READER HOME
    ========================== -->

    <section
      id="presenterReaderHome"
      class="presenterPage presenterReaderHome hidden"
      aria-labelledby="presenterReaderTitle"
    >
      <div class="presenterReaderShell">

        <header class="presenterReaderHeader">

          <div>
            <span class="presenterEyebrow">
              دليل الأسئلة
            </span>

            <h1 id="presenterReaderTitle">
              دليل الأسئلة
            </h1>

            <p
              id="presenterReaderSubtitle"
              aria-live="polite"
            ></p>
          </div>

          <button
            type="button"
            class="presenterReaderLogoutBtn"
            onclick="presenterReaderLogout()"
          >
            خروج
          </button>

        </header>

        <div
          id="presenterReaderSegmentsGrid"
          class="presenterReaderSegmentsGrid"
          aria-live="polite"
        ></div>

      </div>
    </section>


    <!-- =========================
         READER SEGMENT
    ========================== -->

    <section
      id="presenterReaderSegmentPage"
      class="presenterPage presenterReaderSegmentPage hidden"
      aria-labelledby="presenterReaderSegmentTitle"
    >
      <div class="presenterReaderSegmentShell">

        <header class="presenterReaderSegmentTopbar">

          <button
            type="button"
            class="presenterBackBtn"
            onclick="presenterReaderGoHome()"
            aria-label="الدليل"
          >
            الدليل
          </button>

          <h1 id="presenterReaderSegmentTitle">
            الفقرة
          </h1>

          <button
            type="button"
            class="presenterReaderReloadBtn"
            onclick="reloadPresenterReaderSegment()"
          >
            تحديث
          </button>

        </header>

        <div
          id="presenterReaderPanel"
          class="presenterReaderPanel"
          aria-live="polite"
        ></div>

      </div>
    </section>

  </main>


  <!-- =========================
       BOOT LOADING
  ========================== -->

  <div
    id="presenterBootLoading"
    class="presenterBootLoading"
    aria-live="polite"
    aria-busy="true"
  >
    <div class="presenterBootLoadingCard">

      <span
        class="presenterLoadingSpinner"
        aria-hidden="true"
      ></span>

      <strong
        class="presenterLoadingText"
        data-loading-text
      >
        جارٍ تجهيز اللعبة...
      </strong>

    </div>
  </div>


  <!-- =========================
       BACKGROUND LOADING
  ========================== -->

  <div
    id="presenterBackgroundLoading"
    class="presenterBackgroundLoading hidden"
    aria-live="polite"
    aria-hidden="true"
  >
    <span
      class="presenterBackgroundSpinner"
      aria-hidden="true"
    ></span>

    <span>
      جارٍ تحديث البيانات
    </span>
  </div>


  <!-- =========================
       TOAST
  ========================== -->

  <div
    id="presenterToast"
    class="presenterToast hidden"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  >
    <span
      class="gameToastIcon"
      aria-hidden="true"
    >
      !
    </span>

    <span id="presenterToastText"></span>
  </div>


  <!-- =========================
       SCRIPTS
  ========================== -->

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script
    defer
    src="assets/js/supabase.js?v=1050"
  ></script>

  <script
    defer
    src="assets/js/presenter/presenter.js?v=24"
  ></script>

  <script
    defer
    src="assets/js/presenter/warmup-segments.js?v=3"
  ></script>

  <script
    defer
    src="assets/js/presenter/top10-segments.js?v=3"
  ></script>

  <script
    defer
    src="assets/js/presenter/who-segments.js?v=3"
  ></script>

  <script
    defer
    src="assets/js/presenter/explain-segments.js?v=3"
  ></script>

  <script
  src="assets/js/presenter/family-didi-segments.js?v=1"
></script>

  <script
    defer
    src="assets/js/presenter/random-challenge-segments.js?v=9"
  ></script>

  <script
    defer
    src="assets/js/presenter/final-segments.js?v=15"
  ></script>

  <script
    defer
    src="assets/js/presenter/archive-segments.js?v=3"
  ></script>

</body>

</html>
