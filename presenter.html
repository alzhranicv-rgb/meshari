<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#EEF3F6">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <title>لوحة المقدم</title>

  <!-- =====================================================
       PRESENTER CSS
       المسار:
       assets/css/presenter.css?v=3
  ====================================================== -->

  <link
    rel="stylesheet"
    href="assets/css/presenter.css?v=3"
  >
  <!-- Presenter Segments CSS -->
  <link rel="stylesheet" href="assets/css/presenter/presenter-core.css?v=3">
  <link rel="stylesheet" href="assets/css/presenter/segments/warmup-presenter.css?v=3">
  <link rel="stylesheet" href="assets/css/presenter/segments/top10-presenter.css?v=3">
  <link rel="stylesheet" href="assets/css/presenter/segments/who-presenter.css?v=3">
  <link rel="stylesheet" href="assets/css/presenter/segments/explain-presenter.css?v=3">
  <link rel="stylesheet" href="assets/css/presenter/segments/letterli-presenter.css?v=3">
  <link rel="stylesheet" href="assets/css/presenter/segments/final-presenter.css?v=3">
  <link rel="stylesheet" href="assets/css/presenter/segments/random-challenge-presenter.css?v=3">
</head>

<body>

  <main
    id="presenterApp"
    class="presenterApp presenterLandscapeApp"
  >

    <!-- =====================================================
         1) JOIN PAGE / شاشة الدخول
    ====================================================== -->

    <section
      id="presenterJoin"
      class="presenterPage presenterJoinPage"
      aria-labelledby="presenterJoinTitle"
    >

      <div class="presenterJoinShell">

        <header class="presenterJoinHeader">

          <span class="presenterEyebrow">
            الحنكة
          </span>

          <h1 id="presenterJoinTitle">
            لوحة المقدم
          </h1>

          <p>
            أدخل كود الجلسة ثم اختر طريقة الدخول
          </p>

        </header>

        <div
          class="presenterJoinCard"
          role="region"
          aria-label="الدخول إلى الجلسة"
        >

          <div
            class="presenterModeSwitch"
            role="group"
            aria-label="نوع الدخول"
          >

            <button
              type="button"
              id="presenterControlModeBtn"
              class="presenterModeBtn activePresenterMode"
              onclick="setPresenterJoinMode('control')"
            >

              <span
                class="presenterModeIcon"
                aria-hidden="true"
              >
                🎮
              </span>

              <strong>
                وضع التحكم
              </strong>

              <small>
                إدارة اللعبة وإرسال الأوامر
              </small>

            </button>

            <button
              type="button"
              id="presenterReaderModeBtn"
              class="presenterModeBtn"
              onclick="setPresenterJoinMode('reader')"
            >

              <span
                class="presenterModeIcon"
                aria-hidden="true"
              >
                📖
              </span>

              <strong>
                دليل الأسئلة
              </strong>

              <small>
                قراءة الأسئلة والإجابات فقط
              </small>

            </button>

          </div>

          <form
            class="presenterJoinForm"
            onsubmit="
              event.preventDefault();
              joinGameSession();
            "
          >

            <label for="joinCodeInput">
              كود الجلسة
            </label>

            <input
              id="joinCodeInput"
              name="joinCode"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              pattern="[0-9]*"
              maxlength="4"
              enterkeyhint="go"
              placeholder="0000"
              aria-describedby="presenterJoinStatus"
              oninput="
                this.value = this.value
                  .replace(/\D/g, '')
                  .slice(0, 4)
              "
            >

            <button
              type="submit"
              id="presenterJoinBtn"
              class="presenterPrimaryBtn"
            >
              دخول
            </button>

          </form>

          <p
            id="presenterJoinStatus"
            class="presenterJoinStatus"
            role="status"
            aria-live="polite"
          >
            وضع التحكم: ربط مع العرض والتحكم باللعبة
          </p>

        </div>

      </div>

    </section>


    <!-- =====================================================
         2) PRESENTER HOME / الصفحة الرئيسية
    ====================================================== -->

    <section
      id="presenterHome"
      class="presenterPage presenterHomePage presenterLandscapeView hidden"
      aria-labelledby="presenterTitle"
    >

      <div class="presenterHomeShell presenterLandscapeShell">

        <header class="presenterHomeHeader presenterMainHeader">

          <div class="presenterHomeHeading">

            <span class="presenterEyebrow">
              الحنكة
            </span>

            <h1 id="presenterTitle">
              لوحة المقدم
            </h1>

            <p
              id="presenterSubtitle"
              class="presenterSubtitle"
              aria-live="polite"
            ></p>

          </div>

          <div
            class="presenterHomeScores"
            aria-label="النتيجة الإجمالية"
          >

            <article
              class="
                presenterHomeTeam
                presenterHomeTeamA
              "
            >

              <span id="presenterHomeTeamA">
                الفريق الأول
              </span>

              <strong id="presenterHomeScoreA">
                0
              </strong>

            </article>

            <article
              class="
                presenterHomeTeam
                presenterHomeTeamB
              "
            >

              <span id="presenterHomeTeamB">
                الفريق الثاني
              </span>

              <strong id="presenterHomeScoreB">
                0
              </strong>

            </article>

          </div>

        </header>

        <section
          class="presenterSegmentsSection"
          aria-labelledby="presenterSegmentsTitle"
        >

          <div class="presenterSectionHead">

            <div>

              <span>
                الفقرات
              </span>

              <h2 id="presenterSegmentsTitle">
                اختر الفقرة
              </h2>

            </div>

          </div>

          <div
            id="presenterSegmentsGrid"
            class="presenterSegmentsGrid presenterSegmentsCardsGrid"
            aria-live="polite"
          ></div>

        </section>

      </div>

    </section>


    <!-- =====================================================
         3) SEGMENT PAGE / صفحة الفقرة
    ====================================================== -->

    <section
      id="presenterSegmentPage"
      class="presenterPage presenterSegmentPage presenterLandscapeView hidden"
      aria-labelledby="presenterSegmentTitle"
    >

      <div class="presenterSegmentShell presenterLandscapeShell">

        <header class="presenterSegmentTopbar presenterSegmentHeader">

          <button
            type="button"
            class="presenterBackBtn presenterHeaderBtn"
            onclick="presenterGoHome()"
            aria-label="الرجوع إلى الرئيسية"
          >

            <span aria-hidden="true">
              ←
            </span>

            <span>
              الرئيسية
            </span>

          </button>

          <h1 id="presenterSegmentTitle">
            الفقرة
          </h1>

          <div
            class="presenterTopbarSpacer"
            aria-hidden="true"
          ></div>

        </header>

        <div
          id="presenterPanel"
          class="presenterPanel presenterSegmentPanel"
          aria-live="polite"
        ></div>

      </div>

    </section>


    <!-- =====================================================
         4) READER HOME / دليل الأسئلة
    ====================================================== -->

    <section
      id="presenterReaderHome"
      class="presenterPage presenterReaderHome hidden"
      aria-labelledby="presenterReaderTitle"
    >

      <div class="presenterReaderShell">

        <header class="presenterReaderHeader">

          <div>

            <span class="presenterEyebrow">
              وضع القراءة فقط
            </span>

            <h1 id="presenterReaderTitle">
              دليل الأسئلة
            </h1>

            <p
              id="presenterReaderSubtitle"
              aria-live="polite"
            ></p>

          </div>

          <button
            type="button"
            class="presenterReaderLogoutBtn"
            onclick="presenterReaderLogout()"
          >
            خروج
          </button>

        </header>

        <div
          id="presenterReaderSegmentsGrid"
          class="presenterReaderSegmentsGrid"
          aria-live="polite"
        ></div>

      </div>

    </section>


    <!-- =====================================================
         5) READER SEGMENT / دليل فقرة محددة
    ====================================================== -->

    <section
      id="presenterReaderSegmentPage"
      class="
        presenterPage
        presenterReaderSegmentPage
        hidden
      "
      aria-labelledby="presenterReaderSegmentTitle"
    >

      <div class="presenterReaderSegmentShell">

        <header class="presenterReaderSegmentTopbar">

          <button
            type="button"
            class="presenterBackBtn"
            onclick="presenterReaderGoHome()"
            aria-label="الرجوع إلى دليل الأسئلة"
          >

            <span aria-hidden="true">
              ←
            </span>

            <span>
              الدليل
            </span>

          </button>

          <h1 id="presenterReaderSegmentTitle">
            الفقرة
          </h1>

          <div
            class="presenterTopbarSpacer"
            aria-hidden="true"
          ></div>

        </header>

        <div
          id="presenterReaderPanel"
          class="presenterReaderPanel"
          aria-live="polite"
        ></div>

      </div>

    </section>

  </main>


  <!-- =====================================================
       BOOT LOADING / التحميل الأولي
  ====================================================== -->

  <div
    id="presenterBootLoading"
    class="presenterBootLoading"
    aria-live="polite"
    aria-busy="true"
  >

    <div class="presenterBootLoadingCard">

      <span
        class="presenterLoadingSpinner"
        aria-hidden="true"
      ></span>

      <strong>
        جارٍ تجهيز لوحة المقدم...
      </strong>

    </div>

  </div>


  <!-- =====================================================
       BACKGROUND LOADING / التحميل الخلفي
  ====================================================== -->

  <div
    id="presenterBackgroundLoading"
    class="presenterBackgroundLoading hidden"
    aria-live="polite"
    aria-hidden="true"
  >

    <span
      class="presenterBackgroundSpinner"
      aria-hidden="true"
    ></span>

    <span>
      جارٍ تحديث البيانات
    </span>

  </div>


  <!-- =====================================================
       TOAST / التنبيهات
  ====================================================== -->

  <div
    id="presenterToast"
    class="presenterToast hidden"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  >

    <span id="presenterToastText"></span>

  </div>


  <!-- =====================================================
       1) SUPABASE LIBRARY
  ====================================================== -->

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- =====================================================
       2) SUPABASE CONNECTION
       assets/js/supabase.js
  ====================================================== -->

  <script
    defer
    src="assets/js/supabase.js?v=3"
  ></script>


  <!-- =====================================================
       3) PRESENTER CORE
       assets/js/presenter/presenter.js
  ====================================================== -->

  <script
    defer
    src="assets/js/presenter/presenter.js?v=3"
  ></script>


  <!-- =====================================================
       4) WARMUP / التسخين
  ====================================================== -->

  <script
    defer
    src="assets/js/presenter/warmup-segments.js?v=3"
  ></script>


  <!-- =====================================================
       5) TOP 10
  ====================================================== -->

  <script
    defer
    src="assets/js/presenter/top10-segments.js?v=3"
  ></script>


  <!-- =====================================================
       6) WHO / من هو
  ====================================================== -->

  <script
    defer
    src="assets/js/presenter/who-segments.js?v=3"
  ></script>


  <!-- =====================================================
       7) EXPLAIN / اشرح الكلمة
  ====================================================== -->

  <script
    defer
    src="assets/js/presenter/explain-segments.js?v=3"
  ></script>


  <!-- =====================================================
       8) LETTERLI / حرفلي
  ====================================================== -->

  <script
    defer
    src="assets/js/presenter/letterli-segments.js?v=3"
  ></script>


  <!-- =====================================================
       9) RANDOM CHALLENGE / التحدي
  ====================================================== -->

  <script
    defer
    src="assets/js/presenter/random-challenge-segments.js?v=3"
  ></script>


  <!-- =====================================================
       10) FINAL / الفاصلة
  ====================================================== -->

  <script
    defer
    src="assets/js/presenter/final-segments.js?v=3"
  ></script>


  <!-- =====================================================
       11) ARCHIVE / الأرشيف
  ====================================================== -->

  <script
    defer
    src="assets/js/presenter/archive-segments.js?v=3"
  ></script>

</body>

</html>
